<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.tailwindcss.com"></script>

  <title>Brands</title>
</head>

<body class="min-h-screen bg-white text-black transition-colors duration-300 dark:bg-black dark:text-white">

  <section class="w-full overflow-hidden px-5 py-8">

    <!-- TÍTULO -->
    <div class="mb-6 flex items-center justify-between">

      <div>
        <h1 class="text-3xl font-bold tracking-tight">
          Brands
        </h1>

        <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
          Crie o seu
        </p>
      </div>

      <!-- LIGHT / DARK -->
      <button
        onclick="document.documentElement.classList.toggle('dark')"
        class="flex h-10 w-10 items-center justify-center rounded-full border border-gray-200 bg-gray-100 transition hover:scale-105 dark:border-gray-800 dark:bg-gray-900"
        aria-label="Alternar tema"
      >
        <span class="dark:hidden">☾</span>
        <span class="hidden dark:inline">☀</span>
      </button>

    </div>


    <!-- CARROSSEL -->
    <div
      class="flex w-full snap-x snap-mandatory gap-4 overflow-x-auto pb-4"
      style="scrollbar-width:none;"
    >

      <!-- MARCA 1 -->
      <article
        class="relative h-[360px] w-[68%] min-w-[68%] shrink-0 snap-start overflow-hidden rounded-[28px] bg-cover bg-center md:w-[40%] md:min-w-[40%]"
        style="background-image:url('./marca1.png');"
      >

        <div class="absolute inset-0 bg-black/30"></div>

        <div class="absolute inset-x-0 bottom-0 p-6 text-white">

          <p class="mb-2 text-xs uppercase tracking-[0.2em] text-white/70">
            Brand 01
          </p>

          <h2 class="text-3xl font-bold">
            Sua marca.
          </h2>

          <p class="mt-2 text-sm text-white/80">
            Transforme ideias em identidade.
          </p>

        </div>

      </article>


      <!-- MARCA 2 -->
      <article
        class="relative h-[360px] w-[68%] min-w-[68%] shrink-0 snap-start overflow-hidden rounded-[28px] bg-cover bg-center md:w-[40%] md:min-w-[40%]"
        style="background-image:url('./marca2.png');"
      >

        <div class="absolute inset-0 bg-black/30"></div>

        <div class="absolute inset-x-0 bottom-0 p-6 text-white">

          <p class="mb-2 text-xs uppercase tracking-[0.2em] text-white/70">
            Brand 02
          </p>

          <h2 class="text-3xl font-bold">
            Crie o seu.
          </h2>

          <p class="mt-2 text-sm text-white/80">
            Uma identidade feita para você.
          </p>

        </div>

      </article>


      <!-- MARCA 3 -->
      <article
        class="relative h-[360px] w-[68%] min-w-[68%] shrink-0 snap-start overflow-hidden rounded-[28px] bg-cover bg-center md:w-[40%] md:min-w-[40%]"
        style="background-image:url('./marca3.png');"
      >

        <div class="absolute inset-0 bg-black/30"></div>

        <div class="absolute inset-x-0 bottom-0 p-6 text-white">

          <p class="mb-2 text-xs uppercase tracking-[0.2em] text-white/70">
            Brand 03
          </p>

          <h2 class="text-3xl font-bold">
            Explore.
          </h2>

          <p class="mt-2 text-sm text-white/80">
            Dê vida à sua próxima ideia.
          </p>

        </div>

      </article>


      <!-- MARCA 4 -->
      <article
        class="relative h-[360px] w-[68%] min-w-[68%] shrink-0 snap-start overflow-hidden rounded-[28px] bg-cover bg-center md:w-[40%] md:min-w-[40%]"
        style="background-image:url('./marca4.png');"
      >

        <div class="absolute inset-0 bg-black/30"></div>

        <div class="absolute inset-x-0 bottom-0 p-6 text-white">

          <p class="mb-2 text-xs uppercase tracking-[0.2em] text-white/70">
            Brand 04
          </p>

          <h2 class="text-3xl font-bold">
            Comece agora.
          </h2>

          <p class="mt-2 text-sm text-white/80">
            Sua identidade começa aqui.
          </p>

        </div>

      </article>

    </div>


    <!-- INDICADORES -->
    <div class="mt-3 flex justify-center gap-1.5">

      <span class="h-1.5 w-6 rounded-full bg-black dark:bg-white"></span>

      <span class="h-1.5 w-1.5 rounded-full bg-gray-300 dark:bg-gray-700"></span>

      <span class="h-1.5 w-1.5 rounded-full bg-gray-300 dark:bg-gray-700"></span>

      <span class="h-1.5 w-1.5 rounded-full bg-gray-300 dark:bg-gray-700"></span>

    </div>

  </section>

</body>
</html>
