<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<title>Tarefas</title>
</head>
<body class="bg-white text-black min-h-screen">
<main class="max-w-2xl mx-auto p-5">
  <header class="flex items-center justify-between mb-6">
    <div><h1 class="text-2xl font-bold">Tarefas</h1><p class="text-sm text-gray-500">Organize por etapas</p></div>
    <i data-lucide="check-square"></i>
  </header>

  <form id="form" class="flex gap-2 mb-6">
    <input id="title" required placeholder="Nova tarefa..." class="flex-1 border rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-black">
    <button class="bg-black text-white rounded-xl px-4"><i data-lucide="plus"></i></button>
  </form>

  <div id="tasks" class="space-y-4"></div>
</main>

<script>
const form=document.querySelector('#form'),title=document.querySelector('#title'),tasks=document.querySelector('#tasks');
let data=JSON.parse(localStorage.tasks||'[]');

function save(){localStorage.tasks=JSON.stringify(data);render()}
function render(){
 tasks.innerHTML=data.map((t,i)=>`
 <section class="border rounded-2xl overflow-hidden">
  <div class="p-4 flex gap-3 items-center">
   <input value="${t.title}" onchange="edit(${i},this.value)" class="font-semibold flex-1 outline-none bg-transparent">
   <button onclick="del(${i})" class="text-gray-400 hover:text-black"><i data-lucide="trash-2" class="w-4"></i></button>
  </div>
  <div class="border-t bg-gray-50 p-4 space-y-2">
   ${t.children.map((c,j)=>`<div class="bg-white border rounded-xl p-3 flex gap-2 items-start"><p class="flex-1 text-sm">${c}</p><button onclick="childDel(${i},${j})"><i data-lucide="x" class="w-4 text-gray-400"></i></button></div>`).join('')}
   <form onsubmit="child(event,${i})" class="flex gap-2">
    <input required placeholder="Adicionar tarefa..." class="flex-1 bg-white border rounded-xl px-3 py-2 text-sm outline-none">
    <button class="border rounded-xl px-3"><i data-lucide="plus" class="w-4"></i></button>
   </form>
  </div>
 </section>`).join('');
 lucide.createIcons();
}
form.onsubmit=e=>{e.preventDefault();data.push({title:title.value,children:[]});title.value='';save()}
function edit(i,v){data[i].title=v;localStorage.tasks=JSON.stringify(data)}
function del(i){data.splice(i,1);save()}
function child(e,i){e.preventDefault();data[i].children.push(e.target[0].value);save()}
function childDel(i,j){data[i].children.splice(j,1);save()}
render();
</script>
</body>
</html>
