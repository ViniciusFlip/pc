<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<title>Minha Semana</title>

<style>
  body {
    -webkit-tap-highlight-color: transparent;
  }

  button,
  input,
  select {
    font: inherit;
  }

  .task-done {
    opacity: .55;
  }

  .task-done .task-title {
    text-decoration: line-through;
  }

  .tab-active {
    background: #000;
    color: #fff;
  }
</style>
</head>

<body class="bg-gray-50 text-black">

<main class="max-w-3xl mx-auto min-h-screen p-4 sm:p-5">

  <!-- HEADER -->
  <header class="flex justify-between items-center mb-5">

    <div>
      <h1 id="pageTitle" class="text-2xl font-bold">
        Hoje
      </h1>

      <p id="pageSubtitle" class="text-sm text-gray-500">
        Organize sua execução
      </p>
    </div>

    <button
      id="addButton"
      type="button"
      class="bg-black text-white p-3 rounded-xl active:scale-95 transition"
      aria-label="Adicionar atividade"
    >
      <i data-lucide="plus"></i>
    </button>

  </header>


  <!-- NAVEGAÇÃO -->
  <nav class="grid grid-cols-2 bg-gray-200 p-1 rounded-xl mb-5">

    <button
      id="todayTab"
      type="button"
      class="tab-button py-2 rounded-lg text-sm font-medium tab-active"
    >
      Hoje
    </button>

    <button
      id="weekTab"
      type="button"
      class="tab-button py-2 rounded-lg text-sm font-medium"
    >
      Semana
    </button>

  </nav>


  <!-- RESUMO -->
  <section
    id="summary"
    class="grid grid-cols-3 gap-2 mb-5"
  ></section>


  <!-- FORMULÁRIO -->
  <form
    id="addForm"
    class="hidden bg-white border border-gray-200 rounded-2xl p-4 mb-5 space-y-3 shadow-sm"
  >

    <div class="flex justify-between items-center">
      <h2 class="font-bold">
        Nova atividade
      </h2>

      <button
        id="closeForm"
        type="button"
        class="text-gray-400"
      >
        <i data-lucide="x"></i>
      </button>
    </div>


    <select
      id="day"
      class="w-full border border-gray-200 rounded-xl p-3 bg-white"
      required
    >
      <option value="Segunda">Segunda</option>
      <option value="Terça">Terça</option>
      <option value="Quarta">Quarta</option>
      <option value="Quinta">Quinta</option>
      <option value="Sexta">Sexta</option>
      <option value="Sábado">Sábado</option>
      <option value="Domingo">Domingo</option>
    </select>


    <div class="grid grid-cols-2 gap-2">

      <input
        id="time"
        type="time"
        required
        class="w-full border border-gray-200 rounded-xl p-3"
      >

      <input
        id="duration"
        type="number"
        min="1"
        placeholder="Minutos"
        class="w-full border border-gray-200 rounded-xl p-3"
      >

    </div>


    <input
      id="task"
      type="text"
      required
      maxlength="120"
      placeholder="Atividade"
      class="w-full border border-gray-200 rounded-xl p-3"
    >


    <select
      id="type"
      class="w-full border border-gray-200 rounded-xl p-3 bg-white"
    >
      <option value="day">Dia a dia</option>
      <option value="work">Trabalho</option>
      <option value="physical">Físico</option>
    </select>


    <select
      id="priority"
      class="w-full border border-gray-200 rounded-xl p-3 bg-white"
    >
      <option value="low">Prioridade baixa</option>
      <option value="medium" selected>Prioridade média</option>
      <option value="high">Prioridade alta</option>
    </select>


    <div>

      <label class="text-xs text-gray-500 block mb-1">
        Valor financeiro relacionado
      </label>

      <div class="relative">
        <span class="absolute left-3 top-3 text-gray-400">
          R$
        </span>

        <input
          id="money"
          type="number"
          min="0"
          step="0.01"
          placeholder="0,00"
          class="w-full border border-gray-200 rounded-xl p-3 pl-10"
        >
      </div>

    </div>


    <button
      type="submit"
      class="w-full bg-black text-white rounded-xl p-3 font-medium active:scale-[.99]"
    >
      Adicionar atividade
    </button>

  </form>


  <!-- CONTEÚDO -->
  <div id="content"></div>

</main>


<script>

const days = [
  'Segunda',
  'Terça',
  'Quarta',
  'Quinta',
  'Sexta',
  'Sábado',
  'Domingo'
];

const typeLabels = {
  day: 'Dia a dia',
  work: 'Trabalho',
  physical: 'Físico'
};

const typeColors = {
  day: 'bg-blue-100 text-blue-700',
  work: 'bg-green-100 text-green-700',
  physical: 'bg-orange-100 text-orange-700'
};

const statusLabels = {
  pending: 'Pendente',
  done: 'Concluída',
  partial: 'Parcial',
  missed: 'Não feita'
};

const priorityLabels = {
  low: 'Baixa',
  medium: 'Média',
  high: 'Alta'
};


/* =========================
   ESTADO
========================= */

let data = JSON.parse(
  localStorage.getItem('week') || '[]'
);

let currentView = 'today';


/* =========================
   ELEMENTOS
========================= */

const content = document.getElementById('content');
const summary = document.getElementById('summary');

const addForm = document.getElementById('addForm');
const addButton = document.getElementById('addButton');
const closeForm = document.getElementById('closeForm');

const todayTab = document.getElementById('todayTab');
const weekTab = document.getElementById('weekTab');

const pageTitle = document.getElementById('pageTitle');
const pageSubtitle = document.getElementById('pageSubtitle');


/* =========================
   UTILIDADES
========================= */

function save() {
  localStorage.setItem('week', JSON.stringify(data));
  render();
}


function escapeHTML(value) {

  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');

}


function money(value) {

  const number = Number(value || 0);

  return number.toLocaleString('pt-BR', {
    style: 'currency',
    currency: 'BRL'
  });

}


function getToday() {

  const day = new Date().getDay();

  /*
    JS:
    0 = Domingo
    1 = Segunda
    ...
    6 = Sábado
  */

  return days[(day + 6) % 7];

}


function getStatusIcon(status) {

  const icons = {
    pending: 'circle',
    done: 'check-circle-2',
    partial: 'circle-half',
    missed: 'x-circle'
  };

  return icons[status] || 'circle';

}


function getPriorityClass(priority) {

  if (priority === 'high') {
    return 'text-red-600';
  }

  if (priority === 'medium') {
    return 'text-yellow-600';
  }

  return 'text-gray-400';

}


/* =========================
   FORMULÁRIO
========================= */

function openForm() {

  addForm.classList.remove('hidden');

  const today = getToday();

  document.getElementById('day').value = today;

  document.getElementById('task').focus();

}


function closeFormFunction() {

  addForm.classList.add('hidden');
  addForm.reset();

}


addButton.addEventListener('click', openForm);

closeForm.addEventListener('click', closeFormFunction);


/* =========================
   ADICIONAR
========================= */

addForm.addEventListener('submit', function(e) {

  e.preventDefault();

  const task = document.getElementById('task').value.trim();

  if (!task) return;


  const activity = {

    id: crypto.randomUUID(),

    day: document.getElementById('day').value,

    time: document.getElementById('time').value,

    task,

    type: document.getElementById('type').value,

    priority: document.getElementById('priority').value,

    duration: Number(
      document.getElementById('duration').value || 0
    ),

    money: Number(
      document.getElementById('money').value || 0
    ),

    status: 'pending',

    result: '',

    createdAt: new Date().toISOString()

  };


  data.push(activity);

  closeFormFunction();

  save();

});


/* =========================
   ALTERAR STATUS
========================= */

function setStatus(id, status) {

  const item = data.find(a => a.id === id);

  if (!item) return;

  item.status = status;

  save();

}


/* =========================
   RESULTADO
========================= */

function setResult(id) {

  const item = data.find(a => a.id === id);

  if (!item) return;

  const result = prompt(
    'Qual foi o resultado desta atividade?',
    item.result || ''
  );

  if (result === null) return;

  item.result = result.trim();

  save();

}


/* =========================
   EXCLUIR
========================= */

function deleteTask(id) {

  const item = data.find(a => a.id === id);

  if (!item) return;

  if (!confirm(`Excluir "${item.task}"?`)) {
    return;
  }

  data = data.filter(a => a.id !== id);

  save();

}


/* =========================
   RESUMO
========================= */

function renderSummary(items) {

  const total = items.length;

  const done = items.filter(
    a => a.status === 'done'
  ).length;

  const pending = items.filter(
    a => a.status === 'pending'
  ).length;

  const money = items
    .filter(a => a.status === 'done')
    .reduce((sum, a) => sum + Number(a.money || 0), 0);


  summary.innerHTML = `

    <div class="bg-white border border-gray-200 rounded-xl p-3">
      <p class="text-xs text-gray-500">
        Tarefas
      </p>
      <p class="text-xl font-bold">
        ${total}
      </p>
    </div>

    <div class="bg-white border border-gray-200 rounded-xl p-3">
      <p class="text-xs text-gray-500">
        Concluídas
      </p>
      <p class="text-xl font-bold">
        ${done}
      </p>
    </div>

    <div class="bg-white border border-gray-200 rounded-xl p-3">
      <p class="text-xs text-gray-500">
        Resultado
      </p>
      <p class="text-sm font-bold mt-1">
        ${money(money)}
      </p>
    </div>

  `;

}


/* =========================
   CARD DA TAREFA
========================= */

function taskHTML(a) {

  const doneClass =
    a.status === 'done'
      ? 'task-done'
      : '';


  return `

    <article
      class="task-card bg-white border border-gray-200 rounded-2xl p-3 ${doneClass}"
      data-id="${escapeHTML(a.id)}"
    >

      <div class="flex gap-3 items-start">

        <button
          type="button"
          data-action="status"
          data-status="done"
          data-id="${escapeHTML(a.id)}"
          class="mt-1 text-gray-400 active:scale-90"
          aria-label="Concluir"
        >
          <i data-lucide="${getStatusIcon(a.status)}"></i>
        </button>


        <div class="flex-1 min-w-0">

          <div class="flex items-center gap-2">

            <strong class="text-sm">
              ${escapeHTML(a.time)}
            </strong>

            ${
              a.duration
                ? `<span class="text-xs text-gray-400">
                    ${a.duration} min
                   </span>`
                : ''
            }

          </div>


          <p class="task-title text-sm font-medium mt-1">
            ${escapeHTML(a.task)}
          </p>


          <div class="flex flex-wrap items-center gap-2 mt-2">

            <span
              class="${typeColors[a.type]} px-2 py-1 rounded-lg text-xs"
            >
              ${typeLabels[a.type]}
            </span>


            <span
              class="text-xs ${getPriorityClass(a.priority)}"
            >
              ● ${priorityLabels[a.priority]}
            </span>


            ${
              a.money
                ? `<span class="text-xs text-gray-500">
                    ${money(a.money)}
                   </span>`
                : ''
            }

          </div>


          ${
            a.result
              ? `<p class="text-xs text-gray-500 mt-2">
                  Resultado: ${escapeHTML(a.result)}
                 </p>`
              : ''
          }

        </div>


        <button
          type="button"
          data-action="delete"
          data-id="${escapeHTML(a.id)}"
          class="text-gray-300 hover:text-red-500"
          aria-label="Excluir"
        >
          <i data-lucide="trash-2" class="w-4"></i>
        </button>

      </div>


      <div class="grid grid-cols-4 gap-1 mt-3">

        <button
          type="button"
          data-action="status"
          data-status="done"
          data-id="${escapeHTML(a.id)}"
          class="text-xs py-2 rounded-lg bg-green-50 text-green-700"
        >
          Feita
        </button>

        <button
          type="button"
          data-action="status"
          data-status="partial"
          data-id="${escapeHTML(a.id)}"
          class="text-xs py-2 rounded-lg bg-yellow-50 text-yellow-700"
        >
          Parcial
        </button>

        <button
          type="button"
          data-action="status"
          data-status="missed"
          data-id="${escapeHTML(a.id)}"
          class="text-xs py-2 rounded-lg bg-red-50 text-red-700"
        >
          Não feita
        </button>

        <button
          type="button"
          data-action="result"
          data-id="${escapeHTML(a.id)}"
          class="text-xs py-2 rounded-lg bg-gray-100 text-gray-700"
        >
          Resultado
        </button>

      </div>

    </article>

  `;

}


/* =========================
   TELA HOJE
========================= */

function renderToday() {

  const today = getToday();

  const items = data
    .filter(a => a.day === today)
    .sort((a, b) =>
      a.time.localeCompare(b.time)
    );


  pageTitle.textContent = today;

  pageSubtitle.textContent =
    'Execute o que realmente importa';


  renderSummary(items);


  if (!items.length) {

    content.innerHTML = `

      <div class="bg-white border border-dashed border-gray-300 rounded-2xl p-8 text-center">

        <div class="flex justify-center mb-3 text-gray-300">
          <i data-lucide="calendar-plus" class="w-10 h-10"></i>
        </div>

        <h2 class="font-bold">
          Nenhuma atividade hoje
        </h2>

        <p class="text-sm text-gray-500 mt-1">
          Aproveite para planejar o que realmente importa.
        </p>

        <button
          id="emptyAddButton"
          type="button"
          class="mt-4 bg-black text-white px-4 py-2 rounded-xl text-sm"
        >
          Adicionar atividade
        </button>

      </div>

    `;

    document
      .getElementById('emptyAddButton')
      .addEventListener('click', openForm);

  } else {

    content.innerHTML = `

      <section>

        <div class="space-y-2">

          ${items.map(taskHTML).join('')}

        </div>

      </section>

    `;

  }

}


/* =========================
   TELA SEMANA
========================= */

function renderWeek() {

  pageTitle.textContent = 'Minha Semana';

  pageSubtitle.textContent =
    'Planeje sua execução';


  renderSummary(data);


  content.innerHTML = days.map(day => {

    const items = data
      .filter(a => a.day === day)
      .sort((a, b) =>
        a.time.localeCompare(b.time)
      );


    return `

      <section class="mb-6">

        <div class="flex justify-between items-center mb-2">

          <h2 class="font-bold text-lg">
            ${day}
          </h2>

          <span class="text-xs text-gray-400">
            ${items.length}
            ${items.length === 1 ? 'atividade' : 'atividades'}
          </span>

        </div>


        ${
          items.length

            ? `<div class="space-y-2">
                ${items.map(taskHTML).join('')}
               </div>`

            : `<div class="border border-dashed border-gray-200 rounded-xl p-4 text-center text-xs text-gray-400">
                Nenhuma atividade
               </div>`
        }

      </section>

    `;

  }).join('');

}


/* =========================
   EVENTOS DOS CARDS
========================= */

content.addEventListener('click', function(e) {

  const button = e.target.closest('button');

  if (!button) return;


  const action = button.dataset.action;
  const id = button.dataset.id;


  if (action === 'status') {

    setStatus(
      id,
      button.dataset.status
    );

  }


  if (action === 'delete') {

    deleteTask(id);

  }


  if (action === 'result') {

    setResult(id);

  }

});


/* =========================
   ABAS
========================= */

todayTab.addEventListener('click', function() {

  currentView = 'today';

  updateTabs();

  render();

});


weekTab.addEventListener('click', function() {

  currentView = 'week';

  updateTabs();

  render();

});


function updateTabs() {

  todayTab.classList.toggle(
    'tab-active',
    currentView === 'today'
  );

  weekTab.classList.toggle(
    'tab-active',
    currentView === 'week'
  );

}


/* =========================
   RENDER PRINCIPAL
========================= */

function render() {

  updateTabs();

  if (currentView === 'today') {
    renderToday();
  } else {
    renderWeek();
  }

  lucide.createIcons();

}


/* =========================
   MIGRAÇÃO DOS DADOS ANTIGOS
========================= */

data = data.map(item => ({

  id: item.id || crypto.randomUUID(),

  day: item.day,

  time: item.time,

  task: item.task,

  type: item.type || 'day',

  priority: item.priority || 'medium',

  duration: Number(item.duration || 0),

  money: Number(item.money || 0),

  status: item.status || 'pending',

  result: item.result || '',

  createdAt:
    item.createdAt ||
    new Date().toISOString()

}));


save();

</script>

</body>
</html>
