<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Relatório Anual 2026s — PROMON</title>

  <meta
    name="description"
    content="Relatório Anual 2026s da PROMON S.A."
  >

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      overflow-x: hidden;
      background: #fff;
      color: #333;
      font-family: Arial, Helvetica, sans-serif;
    }

    .clip-title {
      clip-path: polygon(0 0, 100% 0, 92% 100%, 0 100%);
    }

    .clip-photo {
      clip-path: polygon(15% 0, 100% 0, 100% 100%, 0 100%);
    }

    .clip-orange-bottom {
      clip-path: polygon(0 0, 82% 0, 100% 100%, 0 100%);
    }

    @media (max-width: 767px) {
      .clip-title {
        clip-path: polygon(0 0, 100% 0, 94% 100%, 0 100%);
      }

      .clip-photo {
        clip-path: polygon(10% 0, 100% 0, 100% 100%, 0 100%);
      }

      .clip-orange-bottom {
        clip-path: polygon(0 0, 88% 0, 100% 100%, 0 100%);
      }
    }
  </style>
</head>

<body>

<main>

  <!-- =====================================================
       HERO
  ====================================================== -->

  <section
    class="relative min-h-screen overflow-hidden bg-white"
    aria-labelledby="hero-title"
  >

    <div
      class="mx-auto flex min-h-screen w-full max-w-[1600px] flex-col px-5 py-5 sm:px-8 sm:py-7 lg:px-14 xl:px-20"
    >

      <!-- =================================================
           HEADER
      ================================================== -->

      <header
        class="relative z-30 flex flex-col gap-5 lg:flex-row lg:items-center lg:gap-8"
      >

        <!-- LOGO -->

        <a
          href="#"
          aria-label="PROMON"
          class="flex w-fit shrink-0 items-center text-[30px] font-light tracking-[-2px] text-[#3b3b3b] sm:text-[38px]"
        >
          PROMON

          <span
            class="ml-1 flex h-6 w-[8px] items-center justify-center bg-[#ed4813] sm:h-8 sm:w-[9px]"
            aria-hidden="true"
          >
            <span class="text-[10px] text-white">
              ▮
            </span>
          </span>
        </a>


        <!-- NAV MOBILE / DESKTOP -->

        <nav
          aria-label="Navegação principal"
          class="flex flex-wrap items-center gap-x-3 gap-y-2 text-[9px] leading-tight text-[#e74816] sm:gap-x-5 sm:text-[11px] lg:ml-8 lg:flex-1"
        >

          <a
            href="#relatorio"
            class="hover:opacity-70"
          >
            Relatório Anual 2026s versões
          </a>

          <span
            class="h-3 w-px bg-[#cfcfcf]"
            aria-hidden="true"
          ></span>

          <a
            href="#demonstracoes"
            class="hover:opacity-70"
          >
            Demonstrações Financeiras 2026s.
          </a>

        </nav>


        <!-- IDIOMA -->

        <button
          type="button"
          class="flex h-9 w-[76px] shrink-0 items-center justify-between rounded-lg border border-[#d5d5d5] bg-white px-3 text-xs text-[#444] transition hover:border-[#ed4813] sm:h-10 sm:w-[88px]"
          aria-label="Selecionar idioma"
        >
          <span>Pt</span>

          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m6 9 6 6 6-6"></path>
          </svg>
        </button>

      </header>


      <!-- =================================================
           HERO PRINCIPAL
      ================================================== -->

      <div
        class="relative flex flex-1 flex-col justify-center"
      >

        <!-- =================================================
             TÍTULO
        ================================================== -->

        <div
          class="relative z-20 mt-10 w-full sm:mt-14 lg:mt-0 lg:w-[59%]"
        >

          <div
            id="relatorio"
            class="clip-title w-full bg-[#ed4813] px-7 py-8 sm:px-10 sm:py-10 md:px-14 md:py-12 lg:max-w-[790px] lg:px-16 lg:py-14 xl:px-20"
          >

            <h1
              id="hero-title"
              class="text-[44px] font-light leading-[0.94] tracking-[-2px] text-white sm:text-[56px] md:text-[66px] lg:text-[76px] xl:text-[88px]"
            >
              Relatório
              <br>
              Anual 2026s
            </h1>

          </div>

        </div>


        <!-- =================================================
             IMAGEM
        ================================================== -->

        <div
          class="relative z-10 mt-[-10px] ml-auto h-[230px] w-[94%] overflow-hidden sm:h-[330px] sm:w-[92%] md:h-[400px] lg:absolute lg:right-[-80px] lg:top-[8%] lg:mt-0 lg:h-[530px] lg:w-[52%] xl:right-[-120px] xl:h-[590px]"
        >

          <div
            class="clip-photo absolute inset-0 overflow-hidden bg-[#ed4813]"
          >

            <img
              src="assets/promon-hero.png"
              alt="Vista urbana com trânsito e arquitetura da cidade"
              class="h-full w-full object-cover object-center"
              loading="eager"
              fetchpriority="high"
            >

            <div
              class="pointer-events-none absolute inset-0 bg-[#ed4813]/15"
              aria-hidden="true"
            ></div>

          </div>

        </div>

      </div>


      <!-- =================================================
           PARTE INFERIOR
      ================================================== -->

      <div
        class="relative z-20 mt-[-5px] min-h-[145px] sm:min-h-[175px] lg:mt-0 lg:min-h-[180px]"
      >

        <!-- FORMA LARANJA -->

        <div
          class="clip-orange-bottom absolute bottom-0 left-[-20px] h-[90px] w-[67%] bg-[#ed4813] sm:left-[-32px] sm:h-[120px] sm:w-[58%] lg:left-[-56px] lg:h-[150px] lg:w-[50%]"
          aria-hidden="true"
        ></div>


        <!-- TEXTO -->

        <div
          id="demonstracoes"
          class="relative flex h-full min-h-[145px] items-end justify-end pb-7 sm:min-h-[175px] sm:pb-9 lg:min-h-[180px] lg:pb-10"
        >

          <p
            class="text-right text-[23px] font-bold tracking-[-0.7px] text-[#e74816] sm:text-[30px] md:text-[36px] lg:text-[42px] xl:text-[48px]"
          >
            A PROMON S.A.
          </p>

        </div>

      </div>

    </div>

  </section>

</main>

</body>
</html>
