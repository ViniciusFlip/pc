<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Relatório Anual 2026s — PROMON</title>

  <meta
    name="description"
    content="Relatório Anual 2026s da PROMON S.A."
  >

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      overflow-x: hidden;
      background: #ffffff;
      color: #333333;
      font-family: Arial, Helvetica, sans-serif;
    }

    .diagonal-right {
      clip-path: polygon(0 0, 100% 0, 92% 100%, 0 100%);
    }

    .diagonal-photo {
      clip-path: polygon(12% 0, 100% 0, 100% 100%, 0 100%);
    }

    .diagonal-bottom {
      clip-path: polygon(0 0, 82% 0, 100% 100%, 0 100%);
    }

    @media (max-width: 640px) {

      .diagonal-right {
        clip-path: polygon(
          0 0,
          100% 0,
          94% 100%,
          0 100%
        );
      }

      .diagonal-photo {
        clip-path: polygon(
          8% 0,
          100% 0,
          100% 100%,
          0 100%
        );
      }

      .diagonal-bottom {
        clip-path: polygon(
          0 0,
          88% 0,
          100% 100%,
          0 100%
        );
      }
    }
  </style>
</head>


<body>

  <main class="min-h-screen overflow-hidden bg-white">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header
      class="mx-auto w-full max-w-[1600px] px-6 pt-7 sm:px-10 lg:px-16 xl:px-20"
    >

      <div
        class="flex flex-col gap-6 lg:flex-row lg:items-center"
      >

        <!-- LOGO -->

        <a
          href="#"
          aria-label="PROMON"
          class="flex w-fit items-center text-[34px] font-light leading-none tracking-[-2.5px] text-[#3b3b3b] sm:text-[40px]"
        >
          PROMON

          <span
            class="ml-1 flex h-[28px] w-[9px] items-center justify-center bg-[#ed4813] sm:h-[32px]"
            aria-hidden="true"
          >
            <span class="text-[10px] text-white">
              ▮
            </span>
          </span>
        </a>


        <!-- NAVEGAÇÃO -->

        <nav
          class="flex flex-wrap items-center gap-x-4 gap-y-2 text-[10px] text-[#d95a39] sm:text-[12px] lg:ml-10 lg:flex-1"
          aria-label="Navegação principal"
        >

          <a
            href="#relatorio"
            class="whitespace-nowrap transition-opacity hover:opacity-60"
          >
            Relatório Anual 2026s versões
          </a>

          <span
            class="h-4 w-px bg-[#cccccc]"
            aria-hidden="true"
          ></span>

          <a
            href="#demonstracoes"
            class="whitespace-nowrap transition-opacity hover:opacity-60"
          >
            Demonstrações Financeiras 2026s.
          </a>

        </nav>


        <!-- IDIOMA -->

        <button
          type="button"
          class="flex h-12 w-[138px] items-center justify-between rounded-xl border border-[#dddddd] bg-white px-5 text-[16px] text-[#444444] lg:h-11 lg:w-[96px] lg:text-sm"
          aria-label="Selecionar idioma"
        >

          <span>Pt</span>

          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m6 9 6 6 6-6"></path>
          </svg>

        </button>

      </div>

    </header>


    <!-- =====================================================
         HERO
    ====================================================== -->

    <section
      id="relatorio"
      class="mx-auto mt-16 w-full max-w-[1600px] px-6 sm:mt-20 sm:px-10 lg:relative lg:mt-24 lg:px-16 xl:px-20"
      aria-labelledby="hero-title"
    >

      <!-- ===================================================
           TÍTULO
      ==================================================== -->

      <div
        class="relative z-20 w-full lg:w-[59%]"
      >

        <div
          class="diagonal-right bg-[#ed4813] px-7 py-9 sm:px-12 sm:py-12 lg:px-16 lg:py-14 xl:px-20"
        >

          <h1
            id="hero-title"
            class="text-[48px] font-light leading-[0.94] tracking-[-2.5px] text-white sm:text-[62px] md:text-[70px] lg:text-[76px] xl:text-[88px]"
          >
            Relatório
            <br>
            Anual 2026s
          </h1>

        </div>

      </div>


      <!-- ===================================================
           IMAGEM
      ==================================================== -->

      <div
        class="relative z-10 mt-[-1px] h-[260px] w-full overflow-hidden sm:h-[360px] md:h-[430px] lg:absolute lg:right-0 lg:top-[5%] lg:mt-0 lg:h-[530px] lg:w-[52%] xl:h-[590px]"
      >

        <div
          class="diagonal-photo relative h-full w-full overflow-hidden bg-[#ed4813]"
        >

          <img
            src="assets/promon-cidade.jpg"
            alt="Vista urbana com trânsito e arquitetura da cidade"
            class="absolute inset-0 h-full w-full object-cover object-center"
            loading="eager"
            fetchpriority="high"
          >

          <div
            class="pointer-events-none absolute inset-0 bg-[#ed4813]/20"
            aria-hidden="true"
          ></div>

        </div>

      </div>


      <!-- ===================================================
           ESPAÇAMENTO / COMPOSIÇÃO
      ==================================================== -->

      <div
        class="relative h-16 sm:h-20 lg:h-[350px]"
      ></div>


      <!-- ===================================================
           RODAPÉ DO HERO
      ==================================================== -->

      <div
        class="relative min-h-[150px] sm:min-h-[180px] lg:min-h-[190px]"
      >

        <!-- FORMA LARANJA -->

        <div
          class="diagonal-bottom absolute bottom-0 left-[-24px] h-[90px] w-[70%] bg-[#ed4813] sm:left-[-40px] sm:h-[125px] lg:left-[-64px] lg:h-[155px]"
          aria-hidden="true"
        ></div>


        <!-- TEXTO -->

        <div
          id="demonstracoes"
          class="relative flex min-h-[150px] items-end justify-end pb-7 sm:min-h-[180px] sm:pb-9 lg:min-h-[190px] lg:pb-10"
        >

          <p
            class="text-right text-[24px] font-bold tracking-[-0.8px] text-[#e74816] sm:text-[32px] md:text-[38px] lg:text-[44px] xl:text-[50px]"
          >
            A PROMON S.A.
          </p>

        </div>

      </div>

    </section>

  </main>

</body>
</html>
