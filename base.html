<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMDA Fansub - Tracker</title>

    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="assets/css/home.css">

    <link rel="stylesheet" href="assets/css/loader.css">

  <body class="bg-[#0f0f0f] text-primary">
    <div id="app-loader"
      class="fixed inset-0 z-[9999] flex items-center justify-center bg-[#0f0f0f]">
      <div class="text-center">
        <!-- Glow -->
        <div class="relative mx-auto w-28 h-28">
          <div class="absolute inset-0 rounded-full bg-[#5864be] blur-3xl opacity-30 animate-pulse"></div>
        </div>
        <h1 class="mt-8 text-3xl font-bold text-white tracking-wide">
          OMDA
        </h1>
        <p class="mt-2 text-zinc-500">
          Private Tracker
        </p>
        <!-- Barra -->
        <div class="mt-10 w-72 h-1 bg-white/10 rounded-full overflow-hidden mx-auto">
          <div id="loader-bar"
            class="h-full bg-[#5864be] rounded-full"
            style="width:0%"></div>
        </div>
        <!-- Status -->
        <p id="loader-text"
          class="mt-5 text-sm text-zinc-400">
          Inicializando...
        </p>
        <p class="mt-8 text-xs text-zinc-600">
          Version 4.0
        </p>
      </div>
    </div>
    <div class="min-h-screen lg:flex">
      <!-- Sidebar -->
      <div id="box-sidebar"></div>
      <!-- Área principal -->
      <main id="main-content" class="flex-1 flex flex-col h-screen overflow-hidden">
        <!-- Header -->
        <div id="header" class="bg-[#171717] border border-white/1 border-theme"></div>
        <!-- Conteúdo -->
        <div id="content" class="flex-1 overflow-auto"></div>
      </main>
      <!-- Painel do usuário -->
      <aside id="user-sidebar" class="hidden  w-80 bg-[#171717] border-l border-theme">

        <div class="user-card  ">

    <div class="overflow-hidden rounded-3xl border border-white/10 bg-[#171717]">

        <!-- Banner -->
        <div class="relative h-36">

            <!-- <img
                src="assets/capa/profile-banner.jpg"
                class="absolute inset-0 h-full w-full object-cover opacity-70"> -->

            <div class="absolute inset-0 bg-gradient-to-t from-[#171717] via-[#171717]/60 to-transparent"></div>

            <!-- Avatar -->
            <div class="absolute -bottom-10 left-1/2 -translate-x-1/2">

                <img
                    src="assets/capa/avatar.png"
                    class="w-20 h-20 rounded-full border-4 border-[#171717] object-cover">

            </div>

        </div>

        <!-- Conteúdo -->

        <div class="pt-14 px-6 pb-6">
 <div class="user-card">
  <a href="#"
    class="group relative block overflow-hidden rounded-3xl border border-white/5
    bg-[linear-gradient(180deg,#1a1c28_0%,#12141d_100%)]
    shadow-[0_0_30px_rgba(88,100,190,.15)]">

    <!-- Glow -->
    <div
      class="absolute inset-0 bg-[radial-gradient(circle_at_top,#5864be30,transparent_65%)]">
    </div>

    <div class="relative p-5">

      <!-- Avatar -->
      <div class="flex flex-col items-center">

        <div
          class="relative w-20 h-20 rounded-3xl bg-[#5864be]/20 p-1 shadow-lg shadow-[#5864be]/30">

          <img
            src="assets/capa/avatar.png"
            class="hidden w-full h-full rounded-2xl object-cover">

        </div>

        <h3
          class="mt-4 text-lg font-bold tracking-wide text-white"
          data-user-name></h3>

        <span
          data-user-role
          class="mt-2 px-3 py-1 rounded-full text-[11px]
          bg-[#5864be]/15
          border border-[#5864be]/30
          text-[#b7c2ff]
          uppercase tracking-widest">
        </span>

        <span
          class="mt-2 text-xs text-zinc-500"
          data-user-email>
        </span>

      </div>

      <!-- Divider -->
      <div
        class="my-5 h-px bg-gradient-to-r from-transparent via-white/10 to-transparent">
      </div>

      <!-- Stats -->
      <div class="grid grid-cols-2 gap-3">

        <div
          class="rounded-2xl border border-white/5 bg-white/[0.03] p-3">

          <div class="flex items-center gap-2 text-green-400">

            <i data-lucide="shield-check" class="w-4 h-4"></i>

            <span class="font-bold">
              2.22
            </span>

          </div>

          <div class="mt-1 text-[11px] uppercase tracking-wider text-zinc-500">
            Ratio
          </div>

        </div>

        <div
          class="rounded-2xl border border-white/5 bg-white/[0.03] p-3">

          <div class="flex items-center gap-2 text-yellow-400">

            <i data-lucide="coins" class="w-4 h-4"></i>

            <span class="font-bold">
              19.57
            </span>

          </div>

          <div class="mt-1 text-[11px] uppercase tracking-wider text-zinc-500">
            Otabills
          </div>

        </div>

        <div
          class="rounded-2xl border border-white/5 bg-white/[0.03] p-3">

          <div class="flex items-center gap-2 text-cyan-400">

            <i data-lucide="upload" class="w-4 h-4"></i>

            <span class="font-bold">
              4.3 TB
            </span>

          </div>

          <div class="mt-1 text-[11px] uppercase tracking-wider text-zinc-500">
            Upload
          </div>

        </div>

        <div
          class="rounded-2xl border border-white/5 bg-white/[0.03] p-3">

          <div class="flex items-center gap-2 text-red-400">

            <i data-lucide="download" class="w-4 h-4"></i>

            <span class="font-bold">
              1.9 TB
            </span>

          </div>

          <div class="mt-1 text-[11px] uppercase tracking-wider text-zinc-500">
            Download
          </div>

        </div>

      </div>

      <!-- Logout -->

      <button
        data-logout
        class="mt-5 flex w-full items-center justify-center gap-2 rounded-2xl
        border border-red-500/20
        bg-red-500/10
        py-3
        text-sm
        text-red-300
        transition
        hover:bg-red-500/20
        hover:text-white">

        <i data-lucide="log-out"></i>

        <span>Sair da Sessão</span>

      </button>

    </div>

  </a>
</div>

            <!-- Continue lendo -->

            <div class="mt-8 rounded-2xl border border-white/5 bg-white/[0.03] p-4">

                <div class="text-xs uppercase tracking-wider text-zinc-500">
                    Continue lendo
                </div>

                <div class="mt-2 text-white font-semibold">
                    One Piece
                </div>

                <div class="text-sm text-zinc-400">
                    Capítulo 1158 • 82% concluído
                </div>

            </div>

            <!-- Estatísticas -->

            <div class="mt-6 grid grid-cols-3 gap-3">

                <div class="rounded-2xl bg-white/[0.03] p-3 text-center">

                    <div class="text-xl font-bold text-white">
                        247
                    </div>

                    <div class="mt-1 text-[11px] text-zinc-500">
                        Mangás
                    </div>

                </div>

                <div class="rounded-2xl bg-white/[0.03] p-3 text-center">

                    <div class="text-xl font-bold text-white">
                        19
                    </div>

                    <div class="mt-1 text-[11px] text-zinc-500">
                        Sequência
                    </div>

                </div>

                <div class="rounded-2xl bg-white/[0.03] p-3 text-center">

                    <div class="text-xl font-bold text-white">
                        S
                    </div>

                    <div class="mt-1 text-[11px] text-zinc-500">
                        Rank
                    </div>

                </div>

            </div>

            <!-- Ação -->

            <button
                class="mt-6 w-full rounded-2xl bg-indigo-600 py-3 font-medium text-white transition hover:bg-indigo-500">

                Continuar Jornada

            </button>

            <!-- Logout -->

            <button
                data-logout
                class="mt-3 flex w-full items-center justify-center rounded-2xl border border-white/10 py-3 text-zinc-400 transition hover:bg-white/5 hover:text-white">
 <i data-lucide="log-out"></i>
                Sair da conta

            </button>
 

        </div>

    </div>

</div>
      </aside>
    </div>
