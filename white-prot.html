<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OMDA Fansubs</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

</head>

<body class="bg-[#edf1f5] text-slate-800 font-[Inter]">

    <!-- Conteúdo -->
<header class="sticky top-0 z-50 border-b border-slate-300 bg-white/80 backdrop-blur-xl">

    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4">

        <!-- Menu -->

        <button class="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-300 bg-white hover:bg-slate-100 lg:hidden">

            <i data-lucide="menu" class="h-5 w-5"></i>

        </button>

        <!-- Logo -->

        <h1 class="text-2xl font-black tracking-widest text-[#5864be]">
            OMDA
        </h1>

        <!-- Desktop -->

        <nav class="hidden items-center gap-8 text-sm font-medium lg:flex">

            <a class="text-[#5864be]" href="#">Home</a>

            <a class="hover:text-[#5864be]" href="#">Torrents</a>

            <a class="hover:text-[#5864be]" href="#">Mangás</a>

            <a class="hover:text-[#5864be]" href="#">Fansubs</a>

            <a class="hover:text-[#5864be]" href="#">Fórum</a>

        </nav>

        <!-- Ações -->

        <div class="flex items-center gap-2">

            <button class="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-300 bg-white hover:bg-slate-100">
                <i data-lucide="search" class="h-5 w-5"></i>
            </button>

            <button class="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-300 bg-white hover:bg-slate-100">
                <i data-lucide="bell" class="h-5 w-5"></i>
            </button>

            <button class="flex h-10 w-10 items-center justify-center rounded-xl bg-[#5864be] text-white">
                <i data-lucide="user" class="h-5 w-5"></i>
            </button>

        </div>

    </div>

</header>
<main>

    <!-- HERO -->
    <section id="hero">
      
    </section>

    <!-- DESTAQUES -->
    <section id="highlights"></section>

    <!-- ÚLTIMOS LANÇAMENTOS -->
    <section id="latest"></section>

    <!-- ANIMES -->
    <section id="anime"></section>

    <!-- MANGÁS -->
    <section id="manga"></section>

    <!-- FILMES -->
    <section id="movies"></section>

    <!-- SÉRIES -->
    <section id="series"></section>

    <!-- OVA / ONA -->
    <section id="ova"></section>

    <!-- TORRENTS RECENTES -->
    <section id="torrents"></section>

    <!-- PROJETOS -->
    <section id="projects"></section>

    <!-- FANSUB -->
    <section id="fansub"></section>

    <!-- ESTATÍSTICAS -->
    <section id="stats"></section>

    <!-- PARCEIROS -->
    <section id="partners"></section>

    <!-- NOTÍCIAS -->
    <section id="news"></section>

    <!-- COMUNIDADE -->
    <section id="community"></section>

    <!-- DISCORD -->
    <section id="discord"></section>

    <!-- DOAÇÕES -->
    <section id="donate"></section>

    <!-- NEWSLETTER -->
    <section id="newsletter"></section>

</main>

<footer></footer>
    <script>
        lucide.createIcons();
    </script>

</body>

</html>
