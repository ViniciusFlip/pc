<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.tailwindcss.com"></script>

  <title>Brands</title>
</head>

<body class="bg-white text-black transition-colors dark:bg-black dark:text-white">

  <section class="w-full overflow-hidden px-5 py-8">

    <!-- TÍTULO -->
    <div class="mb-6 flex items-center justify-between">

      <div>
        <h1 class="text-3xl font-bold">
          Brands
        </h1>

        <p class="mt-1 text-gray-500 dark:text-gray-400">
          Crie o seu
        </p>
      </div>

      <!-- LIGHT / DARK -->
      <button
        onclick="document.documentElement.classList.toggle('dark')"
        class="flex h-10 w-10 items-center justify-center rounded-full border border-gray-200 bg-gray-100 dark:border-gray-800 dark:bg-gray-900"
      >
        ☼
      </button>

    </div>


    <!-- CARROSSEL -->
    <div
      class="flex w-full gap-4 overflow-x-auto snap-x snap-mandatory pb-4"
      style="scrollbar-width:none;"
    >

      <!-- CARD 1 -->
      <div
        class="relative h-[360px] w-[48%] min-w-[48%] shrink-0 snap-start overflow-hidden rounded-[28px] bg-cover bg-center"
        style="background-image:url('https://images.unsplash.com/photo-1558655146-d09347e92766?auto=format&fit=crop&w=1200&q=80');"
      >

        <div class="absolute inset-0 bg-black/40"></div>

        <div class="absolute bottom-0 left-0 p-6 text-white">

          <p class="mb-2 text-xs uppercase tracking-widest text-white/70">
            Brand 01
          </p>

          <h2 class="text-3xl font-bold">
            Sua marca.
          </h2>

          <p class="mt-2 text-sm text-white/80">
            Transforme ideias em identidade.
          </p>

        </div>

      </div>


      <!-- CARD 2 -->
      <div
        class="relative h-[360px] w-[48%] min-w-[48%] shrink-0 snap-start overflow-hidden rounded-[28px] bg-cover bg-center"
        style="background-image:url('https://images.unsplash.com/photo-1561070791-2526d30994b5?auto=format&fit=crop&w=1200&q=80');"
      >

        <div class="absolute inset-0 bg-black/40"></div>

        <div class="absolute bottom-0 left-0 p-6 text-white">

          <p class="mb-2 text-xs uppercase tracking-widest text-white/70">
            Brand 02
          </p>

          <h2 class="text-3xl font-bold">
            Crie o seu.
          </h2>

          <p class="mt-2 text-sm text-white/80">
            Uma identidade feita para você.
          </p>

        </div>

      </div>


      <!-- CARD 3 — 30% -->
      <div
        class="relative h-[360px] w-[30%] min-w-[30%] shrink-0 snap-start overflow-hidden rounded-[28px] bg-cover bg-center"
        style="background-image:url('https://images.unsplash.com/photo-1634942537034-2531766767d1?auto=format&fit=crop&w=1200&q=80');"
      >

        <div class="absolute inset-0 bg-black/40"></div>

        <div class="absolute bottom-0 left-0 p-6 text-white">

          <p class="mb-2 text-xs uppercase tracking-widest text-white/70">
            Brand 03
          </p>

          <h2 class="text-2xl font-bold">
            Explore.
          </h2>

        </div>

      </div>

    </div>


    <!-- INDICADOR -->
    <div class="mt-3 flex justify-center gap-1.5">

      <span class="h-1.5 w-6 rounded-full bg-black dark:bg-white"></span>

      <span class="h-1.5 w-1.5 rounded-full bg-gray-300 dark:bg-gray-700"></span>

      <span class="h-1.5 w-1.5 rounded-full bg-gray-300 dark:bg-gray-700"></span>

    </div>

  </section>

</body>
</html>
