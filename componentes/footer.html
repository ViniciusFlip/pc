       <script> 
         function toggleSidebar() {
         
             const sidebar = document.getElementById('sidebar');
             const logo = document.getElementById('logo');
             const userBox = document.getElementById('user-content-box');
          
             // Mobile
             if (window.innerWidth < 1280) {
                 sidebar.classList.toggle('-translate-x-full');
                 return;
             }
         
             // Desktop
             sidebar.classList.toggle('collapsed');
              logo.classList.toggle("hidden");
              userBox.classList.toggle("hidden");
              
         }
      </script>

      <script>
         const btn = document.getElementById("fullscreenToggle");

const iconMaximize = document.getElementById("iconMaximize");
const iconMinimize = document.getElementById("iconMinimize");

btn.addEventListener("click", async () => {
    if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen();
    } else {
        await document.exitFullscreen();
    }
});

document.addEventListener("fullscreenchange", () => {
    if (document.fullscreenElement) {
        iconMaximize.style.display = "none";
        iconMinimize.style.display = "block";
    } else {
        iconMaximize.style.display = "block";
        iconMinimize.style.display = "none";
    }
});
      </script>
      <script>

const textos = [
    "Inicializando...",
    "Carregando interface...",
    "Verificando sessão...",
    "Sincronizando dados...",
    "Bem-vindo."
];

let i = 0;
let progresso = 0;

const texto = document.getElementById("loader-text");
const barra = document.getElementById("loader-bar");

const intervalo = setInterval(() => {

    progresso += 25;

    barra.style.width = progresso + "%";

    if(i < textos.length-1){
        i++;
        texto.textContent = textos[i];
    }

},500);

window.addEventListener("load",()=>{

    clearInterval(intervalo);

    barra.style.width="100%";
    texto.textContent="Pronto!";

    setTimeout(()=>{

        const loader=document.getElementById("app-loader");

        loader.style.transition=".45s ease";
        loader.style.opacity="0";

        setTimeout(()=>{
            loader.remove();
        },450);

    },300);

});

</script>
