<!doctype html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<title>Tarefas</title>
</head><body class="bg-white text-black min-h-screen"><main class="max-w-2xl mx-auto p-5"><header class="flex items-center justify-between mb-6">
<div>
<h1 class="text-2xl font-bold">Tarefas</h1>
<p class="text-sm text-gray-500">Organize por etapas</p>
</div>
<i data-lucide="check-square"></i>
</header><form id="form" class="flex gap-2 mb-6">
<input id="title" required placeholder="Nova tarefa..." class="flex-1 border rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-black">
<button class="bg-black text-white rounded-xl px-4">
<i data-lucide="plus"></i>
</button>
</form><div id="tasks" class="space-y-4"></div></main><script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
doc,
updateDoc,
deleteDoc,
onSnapshot,
arrayUnion,
arrayRemove
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* 🔥 FIREBASE */

const firebaseConfig = {

apiKey: "SUA_API_KEY",

authDomain: "SEU_PROJETO.firebaseapp.com",

projectId: "SEU_PROJECT_ID",

storageBucket: "SEU_PROJECT_ID.firebasestorage.app",

messagingSenderId: "SEU_SENDER_ID",

appId: "SEU_APP_ID"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const ref = collection(db,"tasks");


/* ELEMENTOS */

const form = document.querySelector("#form");

const title = document.querySelector("#title");

const tasks = document.querySelector("#tasks");


/* CREATE + READ */

onSnapshot(ref,snapshot => {

tasks.innerHTML = snapshot.docs.map(d => {

const t = d.data();

return `

<section class="border rounded-2xl overflow-hidden">

<div class="p-4 flex gap-3 items-center">

<input
value="${t.title}"
onchange="edit('${d.id}',this.value)"
class="font-semibold flex-1 outline-none bg-transparent">

<button
onclick="del('${d.id}')"
class="text-gray-400 hover:text-black">

<i data-lucide="trash-2" class="w-4"></i>

</button>

</div>


<div class="border-t bg-gray-50 p-4 space-y-2">

${(t.children || []).map((c,j) => `

<div class="bg-white border rounded-xl p-3 flex gap-2 items-start">

<p class="flex-1 text-sm">${c}</p>

<button onclick="childDel('${d.id}','${c}')">

<i data-lucide="x" class="w-4 text-gray-400"></i>

</button>

</div>

`).join("")}


<form onsubmit="child(event,'${d.id}')" class="flex gap-2">

<input
required
placeholder="Adicionar tarefa..."
class="flex-1 bg-white border rounded-xl px-3 py-2 text-sm outline-none">

<button class="border rounded-xl px-3">

<i data-lucide="plus" class="w-4"></i>

</button>

</form>

</div>

</section>

`;

}).join("");

lucide.createIcons();

});


/* CREATE */

form.onsubmit = async e => {

e.preventDefault();

await addDoc(ref,{

title:title.value,

children:[]

});

title.value="";

};


/* UPDATE */

window.edit = async (id,value) => {

await updateDoc(doc(db,"tasks",id),{

title:value

});

};


/* DELETE */

window.del = async id => {

await deleteDoc(doc(db,"tasks",id));

};


/* CREATE SUBTASK */

window.child = async (e,id) => {

e.preventDefault();

const value = e.target[0].value;

await updateDoc(doc(db,"tasks",id),{

children:arrayUnion(value)

});

};


/* DELETE SUBTASK */

window.childDel = async (id,value) => {

await updateDoc(doc(db,"tasks",id),{

children:arrayRemove(value)

});

};

lucide.createIcons();

</script></body>
</html>
